name: Trading Alerts

on:
  schedule:
    # Every 5 min, Mon-Fri, 03:30-18:05 UTC = 09:00-23:35 IST
    - cron: '*/5 3-18 * * 1-5'
  workflow_dispatch:   # manual trigger button on GitHub

jobs:
  run_alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 4   # kill if stuck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install fyers-apiv3

      - name: Run alert system
        env:
          FYERS_CLIENT_ID:  ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_TOKEN:      ${{ secrets.FYERS_TOKEN }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_ID:          ${{ secrets.GIST_ID }}
          GH_PAT:           ${{ secrets.GH_PAT }}
        run: python live_alerts_github.py
